<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>성실호</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a crew datapad from the arkship Diligent. Ceramic hull shell (worn off-white plating, amber running lights),
   a dark visor screen holding the pixel map, the dialogue box as a comms readout, D-pad + A/B below.
   Single deliberate look (the device is the same in any room light), so colors are fixed, not theme-switched. */
:root{
  color-scheme:light;
  --hull:#D5D8CF; --hull-2:#C3C7BC; --seam:#9AA096; --ink:#1D2227; --muted:#5B625C;
  --amber:#E8962A; --amber-ink:#2A1904; --amber-soft:#F6D9A6;
  --glass:#0F141A; --glass-2:#1A222B; --glass-edge:#2C3742; --glass-ink:#E6EBE2; --glass-muted:#93A09A;
  --cyan:#69CFD8; --red:#D2533F; --b:#4C5862;
  --frame:#7F867D; --frame-sh:#A9AEA4; --pad-sh:#A3A99F; --sel:var(--ink); --sel-ink:var(--amber-soft);
  --display:"Orbit","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}/* dark mode for the chrome around the screen: follows the device, and claude.ai's own theme switch */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--hull:#171B1F;--hull-2:#1E2328;--seam:#3B434A;--ink:#E3E7E0;--muted:#9AA29B;--b:#56626C;--frame:#3B434A;--frame-sh:#0B0E11;--pad-sh:#0B0E11;--sel:var(--amber);--sel-ink:var(--amber-ink)}}
:root[data-theme="dark"]{color-scheme:dark;--hull:#171B1F;--hull-2:#1E2328;--seam:#3B434A;--ink:#E3E7E0;--muted:#9AA29B;--b:#56626C;--frame:#3B434A;--frame-sh:#0B0E11;--pad-sh:#0B0E11;--sel:var(--amber);--sel-ink:var(--amber-ink)}

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--hull);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-image:linear-gradient(var(--hull-2) 1px,transparent 1px),linear-gradient(90deg,var(--hull-2) 1px,transparent 1px);background-size:100% 96px,120px 100%}
button{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font:inherit}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:0 16px;padding-block:12px 20px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.id{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 0}
.id .reg{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1;letter-spacing:.02em;white-space:nowrap}
h1 .lamp{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--amber);margin-left:.35em;vertical-align:.18em;box-shadow:0 0 0 2px var(--hull),0 0 10px var(--amber)}
.hbtns{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex:none}
.pill{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;background:var(--hull);color:var(--ink);border:2px solid var(--seam);border-radius:6px;padding:6px 9px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:inset 0 -2px 0 var(--hull-2)}
.pill[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.pill.log{background:var(--amber);border-color:#B8701A;color:var(--amber-ink)}

.quest{font-family:var(--mono);font-size:.8rem;display:flex;gap:10px;align-items:center;color:var(--ink);line-height:1.35;min-height:1.35em}
.quest b{font-weight:500;background:var(--sel);color:var(--sel-ink);padding:1px 6px;border-radius:3px;letter-spacing:.08em;flex:none}
.quest span{font-family:var(--body);font-weight:600}

.screen{position:relative;border-radius:14px;overflow:hidden;background:var(--glass);line-height:0;border:3px solid var(--frame);box-shadow:inset 0 0 0 3px var(--glass),0 2px 0 var(--frame-sh)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}
.zone{transition:opacity .6s;}.zone.dim{opacity:0}
.zone{position:absolute;left:8px;top:8px;line-height:1.2;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;color:var(--glass-ink);background:rgba(15,20,26,.72);border:1px solid var(--glass-edge);padding:3px 7px;border-radius:4px;pointer-events:none;transition:opacity .4s}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
.fade.on{opacity:1}

.dlg{position:absolute;left:6px;right:6px;bottom:6px;line-height:1.5;background:rgba(15,20,26,.96);color:var(--glass-ink);border:2px solid var(--glass-edge);border-top:3px solid var(--amber);border-radius:6px;padding:9px 12px 11px;display:flex;flex-direction:column;gap:7px;max-height:calc(100% - 12px);box-sizing:border-box;overflow:auto}
.face{position:absolute;left:8px;top:8px;width:84px;height:84px;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;background:radial-gradient(circle at 50% 38%,#d3dce6,#8e9cb0);border-radius:6px}
.dlg.hasface{padding-left:100px;min-height:100px}
.who{display:flex;gap:8px;align-items:center;justify-content:space-between}
.who .nm{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;color:var(--amber)}
.who .tag{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;color:var(--glass);background:var(--cyan);border-radius:3px;padding:0 6px;margin-left:6px}
.spk{flex:none;width:30px;height:26px;border-radius:5px;border:1px solid var(--glass-edge);background:var(--glass-2);color:var(--glass-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.spk svg{width:16px;height:16px}
.spk.on{color:var(--cyan);border-color:var(--cyan)}
.txt{font-family:var(--body);font-size:1.12rem;font-weight:600;min-height:1.5em;word-break:keep-all}
.gl{color:var(--amber-soft);text-decoration:underline dotted var(--amber);text-underline-offset:3px;cursor:help}
.more{align-self:flex-end;font-size:.7rem;color:var(--amber);animation:blink 1s steps(2) infinite;line-height:1}
@keyframes blink{50%{opacity:0}}
.choices{display:flex;flex-direction:column;gap:5px}
.choice{font-family:var(--body);font-size:1.05rem;font-weight:600;text-align:left;background:var(--glass-2);color:var(--glass-ink);border:1px solid var(--glass-edge);border-radius:5px;padding:7px 11px;cursor:pointer;word-break:keep-all;display:flex;gap:8px}
.choice::before{content:"▸";color:var(--amber);visibility:hidden}
.choice.sel{border-color:var(--amber);background:#2A2418}
.choice.sel::before{visibility:visible}
.build{display:flex;flex-direction:column;gap:7px}
.slots{display:flex;flex-wrap:wrap;gap:5px;min-height:2.1em;align-items:center;border-bottom:1px dashed var(--glass-edge);padding-bottom:6px}
.slots .ph{font-family:var(--mono);font-size:.75rem;color:var(--glass-muted);letter-spacing:.1em}
.slots span.t{font-weight:600;font-size:1.05rem;color:var(--cyan)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{font-family:var(--body);font-weight:600;font-size:1.05rem;background:var(--glass-2);color:var(--glass-ink);border:1px solid var(--glass-edge);border-radius:5px;padding:6px 10px;cursor:pointer}
.tile.sel{border-color:var(--amber);background:#2A2418}
.tile.bad{animation:shake .3s}
.tile.used{visibility:hidden}
.tile.hint{animation:hint 1.1s ease-in-out infinite;border-color:var(--amber)}
@keyframes hint{0%,100%{transform:none}50%{transform:translateY(-4px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.gloss{position:absolute;left:12px;right:12px;top:10px;line-height:1.45;background:var(--amber-soft);color:var(--amber-ink);border-radius:6px;padding:8px 11px;font-size:.9rem;z-index:2;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.gloss b{font-family:var(--display);font-weight:400;font-size:1.05rem;margin-right:6px}
.gloss{display:flex;flex-direction:column;gap:5px;padding-right:44px}
.gloss .gx{display:block;position:absolute;right:42px;top:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.18);color:inherit;font-size:1.1rem;line-height:1;cursor:pointer}
.gloss{padding-right:82px}
.gloss .gr{line-height:1.45;word-break:keep-all}
.gloss .en{font-family:var(--mono);font-size:.72rem;opacity:.75;display:block;margin-top:1px}
.gloss .q{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--amber-ink);background:transparent;color:var(--amber-ink);font-family:var(--mono);font-weight:500;cursor:pointer;line-height:1}
.txt .w{cursor:pointer;border-radius:3px}
.txt .w:active{background:rgba(232,166,74,.25)}
.card .enb{width:26px;height:26px;padding:0;border-radius:50%;text-align:center}
.toast{position:absolute;left:50%;top:34px;transform:translateX(-50%);line-height:1.3;background:var(--amber);color:var(--amber-ink);font-family:var(--body);font-weight:600;font-size:.95rem;padding:6px 14px;border-radius:5px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;z-index:3;box-shadow:0 3px 0 #9A5E14}

.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:6px;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);filter:drop-shadow(0 3px 0 var(--pad-sh))}
.dpad button{background:#3B444C;border:0;color:#AEB8B2;font-size:1.05rem;cursor:pointer;touch-action:none}
.dpad .u{grid-column:2;grid-row:1;border-radius:8px 8px 0 0}
.dpad .l{grid-column:1;grid-row:2;border-radius:8px 0 0 8px}
.dpad .c{grid-column:2;grid-row:2;background:#3B444C}
.dpad .r{grid-column:3;grid-row:2;border-radius:0 8px 8px 0}
.dpad .d{grid-column:2;grid-row:3;border-radius:0 0 8px 8px}
.dpad button.on{background:#262D33;color:var(--amber)}
.ab{display:flex;gap:14px;align-items:flex-end;transform:rotate(-16deg)}
.ab button{width:64px;height:64px;border-radius:50%;font-family:var(--mono);font-size:1.25rem;border:0;cursor:pointer;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.ab .A{background:var(--amber);color:var(--amber-ink);margin-bottom:22px;transition:box-shadow .2s}
.ab .A.ready{box-shadow:0 4px 0 rgba(0,0,0,.28),0 0 0 4px var(--hull),0 0 0 6px var(--amber)}
.ab .B{background:var(--b);color:#DCE3DF}
.ab button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.28)}

.panel{position:fixed;inset:0;background:rgba(15,20,26,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.sheet{background:var(--hull);color:var(--ink);border-radius:10px;border-top:4px solid var(--amber);max-width:440px;width:100%;max-height:92%;overflow:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.35rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sheet h2 small{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.sheet h3{margin:0;font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.14em;color:var(--muted)}
.wlist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wd{border:1px solid var(--seam);background:var(--hull);border-radius:6px;padding:7px 4px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer;min-width:0;color:var(--ink)}
.wd .w{font-weight:600;font-size:.95rem;word-break:keep-all}
.wd.off{border-style:dashed;cursor:default}
.wd.off .w{color:var(--seam)}
.wd.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pips{display:flex;gap:2px}
.pips i{width:6px;height:6px;border-radius:1px;background:var(--hull-2)}
.pips i.on{background:var(--amber)}
.pips.due i.on{background:var(--cyan)}
.card{background:var(--glass);color:var(--glass-ink);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .big{font-family:var(--display);font-size:1.6rem;line-height:1.1}
.card .def{font-weight:600}
.card .ex{color:var(--glass-muted);font-size:.92rem}
.card .hj{font-family:var(--mono);font-size:.78rem;color:var(--amber-soft)}
.card .en{font-family:var(--mono);font-size:.78rem;color:var(--glass-muted)}
.card .enb{align-self:flex-start;font-family:var(--mono);font-size:.72rem;background:transparent;color:var(--glass-muted);border:1px solid var(--glass-edge);border-radius:4px;padding:2px 8px;cursor:pointer}
.items{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.items li{font-size:.88rem;font-weight:600;background:var(--amber-soft);color:var(--amber-ink);border-radius:4px;padding:3px 9px}
.items li.none{background:transparent;color:var(--muted);font-weight:400;padding:3px 0}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{font-family:var(--body);font-weight:600;font-size:.95rem;border-radius:6px;padding:8px 14px;cursor:pointer;border:2px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--sel);color:var(--sel-ink)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.warn.armed{background:var(--red);color:#fff}
.chlist{display:flex;flex-direction:column;gap:8px}
.chap{display:flex;gap:12px;align-items:center;text-align:left;background:var(--hull);color:var(--ink);border:2px solid var(--seam);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0}
.chap.cur{border-color:var(--ink)}
.chap .cn{flex:none;width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1rem;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.chap .ci{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chap .ci b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.chap .ci small{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap .cp{font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.quest span{flex:1;min-width:0}
.talkbtn{flex:none;margin-left:auto;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;background:transparent;color:var(--ink);border:2px solid var(--seam);border-radius:6px;padding:3px 8px;cursor:pointer}
.talksheet{height:min(78vh,640px)}
.talklog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;background:var(--glass);color:var(--glass-ink);border-radius:8px;padding:12px;line-height:1.5}
.tl{display:flex;flex-direction:column;gap:1px}
.tl .tw{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--amber)}
.tl .tt{font-weight:600;font-size:1rem;word-break:keep-all}
.startrow{display:flex;justify-content:center;padding-top:10px}
.start{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;background:var(--b);color:#DCE3DF;border:0;border-radius:999px;padding:7px 18px;cursor:pointer;transform:rotate(-16deg);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.start:active{transform:rotate(-16deg) translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.games{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}.games span{font-size:.8rem;opacity:.7;width:100%}.games a{font-weight:700;font-size:.92rem;color:inherit;border:2px dashed currentColor;border-radius:8px;padding:5px 10px;text-decoration:none;opacity:.85}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{font-family:var(--body);font-weight:700;font-size:1.05rem;padding:14px 10px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.mi.wide{grid-column:1/-1}.mi small{font-weight:400;opacity:.75;margin-left:6px}
.mi.toggle::after{content:' · 꺼짐';font-weight:400;opacity:.7}.mi.toggle[aria-pressed="true"]::after{content:' · 켜짐'}
.mi.toggle[aria-pressed="true"]{background:var(--ink);color:var(--hull)}
.tapsort{justify-content:flex-start;gap:6px}.tapsort .btn{padding:4px 12px;font-size:.85rem}.tapsort .btn.on{background:var(--sel);color:var(--sel-ink)}
.tp{display:flex;flex-direction:column;gap:2px;cursor:pointer;padding-bottom:8px;border-bottom:1px solid rgba(127,127,127,.25)}
.tph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.tph b{font-size:1.1rem}
.tpm{font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;color:var(--amber);white-space:nowrap}
.tpk{font-size:.95rem;word-break:keep-all}.tpe{font-size:.85rem;color:var(--glass-muted)}
.tl-empty{color:var(--glass-muted);margin:0}
body.talkopen .gloss{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));z-index:20;box-sizing:border-box}
@media (max-width:370px){.dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}.ab button{width:56px;height:56px}.wlist{grid-template-columns:repeat(3,1fr)}h1{font-size:1.35rem}}
@media (prefers-reduced-motion: reduce){.more{animation:none}.fade{transition:none}.tile.bad{animation:none}.tile.hint{animation:none}}
</style>
</head><body>
<div class="wrap">
  <header>
    <div class="id"><span class="reg" id="reg">ARK DILIGENT</span><h1>성실호<span class="lamp"></span></h1></div>
    <div class="hbtns">
      <button class="pill log" id="logBtn">일지 0/16</button>
    </div>
  </header>
  <div class="quest" id="quest"><b>목표</b><span id="questTxt"></span></div>
  <div class="screen" id="screen">
    <canvas id="cv" width="176" height="160"></canvas>
    <div class="zone" id="zone"></div>
    <div class="fade" id="fade"></div>
    <div class="gloss" id="gloss" hidden></div>
    <div class="dlg" id="dlg" hidden>
      <canvas class="face" id="face" width="48" height="48" hidden></canvas>
      <div class="who"><span><span class="nm" id="who"></span><span class="tag" id="tag" hidden>복습</span></span>
        <button class="spk" id="spk" aria-label="다시 듣기"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 5.5c1 .8 1 4.2 0 5" stroke="currentColor" fill="none" stroke-width="1.4"/><path d="M12.8 3.8c2 1.8 2 6.6 0 8.4" stroke="currentColor" fill="none" stroke-width="1.4"/></svg></button></div>
      <div class="txt" id="txt"></div>
      <div class="choices" id="choices" hidden></div>
      <div class="build" id="build" hidden><div class="slots" id="slots"></div><div class="tiles" id="tiles"></div></div>
      <div class="more" id="more" hidden>▼</div>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <div class="pad">
    <div class="dpad" id="dpad">
      <button class="u" data-d="up" aria-label="위">▲</button>
      <button class="l" data-d="left" aria-label="왼쪽">◀</button>
      <span class="c"></span>
      <button class="r" data-d="right" aria-label="오른쪽">▶</button>
      <button class="d" data-d="down" aria-label="아래">▼</button>
    </div>
    <div class="ab">
      <button class="B" id="btnB" aria-label="B">B</button>
      <button class="A" id="btnA" aria-label="A">A</button>
    </div>
  </div>
  <div class="startrow"><button class="start" id="startBtn" aria-label="메뉴">START</button></div>
</div>
<div class="panel" id="startPanel" hidden>
  <div class="sheet startsheet" role="dialog" aria-label="메뉴">
    <h2>메뉴 <button class="btn" id="startClose">닫기</button></h2>
    <div class="mgrid">
      <button class="mi" id="talkBtn">대화</button>

 if(!hasItem('우주복'))return '헬멧을 쓰고 나가요.';

 return false;
}

/* the Ghost chase on the stairs: each Ghost walks the player's own trail, a few steps behind */
const trail=[];
function track(){
 if(ZID!=='tower'||!f().chase||f().mined){trail.length=0;return}
 const l=trail[trail.length-1];if(!l||l[0]!==player.x||l[1]!==player.y)trail.push([player.x,player.y]);if(trail.length>16)trail.shift();
}
const ghostPos=(delay,home,wreck)=>()=>{if(f().mined)return wreck;track();const k=trail.length-1-delay;return k>=0?trail[k]:home};

const SH={};const shc=(c,k)=>SH[c+k]||(SH[c+k]=sh(c,k));
const org=(x,y)=>{const c=at(x,y);let a=x,b=y;while(at(a-1,y)===c)a--;while(at(x,b-1)===c)b--;return [a,b]};
const CVS={};
function cvs(key,w,h,draw){let c=CVS[key];if(!c){c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');
 const R=(x,y,ww,hh,col)=>{q.fillStyle=col;q.fillRect(x,y,ww,hh)};
 const L=(x0,y0,x1,y1,w2,col)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0;for(let i=0;i<=n;i++){const u=n?i/n:0;R(Math.round(x0+(x1-x0)*u),Math.round(y0+(y1-y0)*u),w2,w2,col)}};
 draw(R,L);CVS[key]=c}return c}
function blit(c,X,Y,x,y){const [ox,oy]=org(x,y);g.drawImage(c,(x-ox)*16,(y-oy)*16,16,16,X,Y,16,16)}

/* scripted walks. walk:{npc,from}: the NPC appears at `from` and walks to its own spot (e.g. the class president going back to her desk).

function walkPath([fx,fy],[tx,ty],self){

  for(const [dx,dy] of Object.values(D)){const a=x+dx,b=y+dy,kk=k(a,b);if(kk in prev)continue;
   if(!(a===tx&&b===ty)&&(!walkable(a,b)||live().some(o=>o!==self&&npcPos(o)[0]===a&&npcPos(o)[1]===b)))continue;prev[kk]=[x,y];q.push([a,b])}}

}
function queueWalks(s){  // one or a list each

function startWalks(){

function walkAt(n,t){ // → [x,y,dir,frame] while walking, null when arrived

/* praise after a right answer: a step's own `ok`, else 맞아! from a friend who speaks 반말 (NPC banmal:1), else 맞아요! */
const okWord=s=>s.ok||(dlg.npc&&dlg.npc.banmal?'맞아!':'맞아요!');
function choose(s,i){
 const o=s.opts[i];
 if(o[1]){

  dlg.next='advance';
  const line=s.ask.includes('___')?s.ask.replace('___',o[0]):o[0];
  if(s.who==='나'&&!s.listenOnly||s.own){  /* own:1 — the line is the speaker's own words, not a reply to you */
   // the toast is always praise; an ok: that isn't praise ("뭐?", "…") is the other person's reaction, so they say it next
   const react=s.ok&&!/^(맞아|정답|좋아|딩동댕)/.test(s.ok)?s.ok:null;
   toast(react?(dlg.npc&&dlg.npc.banmal?'맞아!':'맞아요!'):okWord(s));show({who:s.who||dlg.name,say:line});
   if(react)dlg.next={who:s.reactWho||dlg.name,say:react}}else show({who:s.who==='나'?dlg.name:s.who,say:okWord(s)+' '+(s.listenOnly?`"${o[0]}"`:line)});
 }else{
  sfx('no');s.missed=true;if(s.w)dlg.missed.add(s.w);
  dlg.next=s;show({who:s.who==='나'?'…':s.who,say:o[2]||'다시 해 봐요.'});  // after your own line, the hint is narration
 }

const says=a=>(Array.isArray(a)?a:[a]).map(t=>({say:t}));

function allQuestions(){
 const out=[...(C.BANK||[])];Object.keys(C.Q).forEach(k=>{if(k!=='cafe')out.push(...C.Q[k])});return out;
}
function reviewFor(words){ // pick a question for the weakest of these words
 const ws=[...words].sort((a,b)=>(isDue(b)-isDue(a))||(lv(a).b-lv(b).b));
 const w=ws[0];
 const qs=allQuestions().filter(q=>q.w===w);
 const narr={review:true,who:'…',ok:'맞아요!'};  /* asked by the narrator: the sentences are generic examples, not in the NPC's voice */
 if(canSpeak()&&soundOn&&Math.random()<.35)return {listen:w,...narr};  // a muted phone can't answer a listening question
 return {...qs[Math.random()*qs.length|0],...narr};
}
function terminal(){
 const due=dueWords();
 if(!state.badges.length)return [{who:TERM.name,say:TERM.empty}];
 if(!due.length){const n=nextDue();return [{who:TERM.name,say:TERM.idle+(n?` ${TERM.next}: ${fmtWait(n-now())} 후.`:'')}]}
 const pick=shuffle(due.slice()).slice(0,4);
 const steps=[{who:TERM.name,say:TERM.due(due.length)}];
 pick.forEach(w=>steps.push(reviewFor([w])));
 steps.push({who:TERM.name,say:TERM.end});
 return steps;
}
function facing(){
 const [dx,dy]=D[player.dir];const tx=player.x+dx,ty=player.y+dy;
 let n=npcAt(tx,ty);
 if(!n&&(Z.legend[at(tx,ty)]||{}).over)n=npcAt(tx+dx,ty+dy);
 if(n)return {n};
 if(petOn()&&pet.x===tx&&pet.y===ty&&!(pet.x===player.x&&pet.y===player.y))return {pet:1};
 const key=tx+','+ty;
 if(Z.legend[at(tx,ty)]?.tile==='terminal')return {term:1};
 if(Z.spots&&Z.spots[key])return {spot:Z.spots[key]};
 const w=warpAt(tx,ty);if(w&&w.lock&&w.lock())return {spot:w.lock()};
 /* things: a line for every tile of a kind (Z.things[char] = text | [variants, picked by position] | fn(x,y) → either) */
 const th=Z.things&&Z.things[at(tx,ty)],tv=typeof th==='function'?th(tx,ty):th;
 if(tv)return {spot:Array.isArray(tv)?tv[(tx*7+ty*13)%tv.length]:tv};  // tv may also be {steps:[…]} (a conversation)
 return null;
}
/* {chat:'id'} on someone who is answering another: [opener, answerer] when both are here, so either one plays the whole exchange */
function chatPair(n){
 const L=live(),o=n.chat?C.NPC[n.chat]:L.find(m=>m.chat&&C.NPC[m.chat]===n);
 return o&&L.includes(o)&&!(o.badge&&o.badge.length)?(n.chat?[o,n]:[n,o]):null;
}
function interact(){
 if(!$('gloss').hidden){hideGloss();return}  // A closes the definition first, without advancing
 if(panelOpen())return;
 if(choosing()||building()){confirmSel();return}
 if(dlg){advance();return}
 if(player.moving||warping)return;
 const F=facing();if(!F)return;
 if(F.n){
  let n=F.n;if(n.proxy){const p=n.proxy();if(p)n=p}
  if(!n.pos&&!sitting(n)&&!n.fixed){n.dir=OPP[player.dir];n.turnAt=performance.now()+6000}  // fixed: furniture (a chair) never turns to face you
  let steps=n.script?n.script():null,isReview=false;
  if(!steps){
   if(n.badge&&n.badge.every(has)){steps=[...says(n.after),reviewFor(n.badge)];isReview=true}
   else steps=n.talk();
  }
  const pair=!isReview&&chatPair(n);  // two people talking to each other: whoever you face, the one who started speaks first
  if(pair){const said=m=>(m===n?steps:(m.script&&m.script())||m.talk()).map(s=>s.who?s:{...s,who:m.name,look:m.look});steps=[...said(pair[0]),...said(pair[1])]}
  openDialog(n.name,steps,{npc:n,review:isReview});return;
 }
 if(F.pet){openDialog(C.FOLLOW.name,C.FOLLOW.talk());return}
 if(F.term){openDialog(TERM.name,terminal(),{review:true});return}
 if(F.spot){openDialog('…',F.spot.steps||says(F.spot))}
}

function award(words){
 const nw=words.filter(w=>!has(w));if(!nw.length)return;
 state.badges.push(...nw);
 const perfect=nw.filter(w=>!dlg.missed.has(w));
 nw.forEach(w=>{state.lv[w]=perfect.includes(w)?{b:2,due:now()+GAP[2]}:{b:0,due:now()}});
 save();updateHud();sfx('badge');
 toast('일지에 추가: '+nw.join(', '));
 const note=perfect.length===nw.length
  ?{who:LOGNAME,say:`한 번도 안 틀렸어요! "${nw.join('", "')}" 기억 레벨 2/5.`}
  :{who:LOGNAME,say:`일지에 적었어요. 틀린 단어는 곧 다시 나와요. 머리 위 ? 를 찾아요.`};
 if(firstTime(perfect.length===nw.length?'awardPerfect':'awardMissed'))dlg.steps.splice(dlg.i+1,0,note);
 if(state.badges.length>=C.WORDS.length&&!state.f.allWords){state.f.allWords=1;save();pending=says([`단어 ${C.WORDS.length}개를 다 모았어요!`,`이제 ${TERM.name}에서 복습하면 ★가 생겨요.`])}
}

 hair:['#1E1B22','#4A3426','#7A4B2A','#C9A15A','#B23A3A','#5A6FA8','#D8D2C4'],skin:['#F6D7BD','#F1C9A5','#E2AE86','#C68A5E','#8E5A3C']};

function openMe(done){
 meDraft={style:'short',hair:'#1E1B22',skin:'#F1C9A5',lashes:0,lips:0,...(me||{})};meDone=done||null;
 const sw=(k,v,label,bg)=>`<button class="mo${bg?' sw':''}" data-k="${k}" data-v="${v}" ${bg?`style="background:${v}" aria-label="${label}"`:''}>${bg?'':label}</button>`;

  <div class="mrow"><span>머리 색</span><div>${ME_OPTS.hair.map((v,i)=>sw('hair',v,'머리 색 '+(i+1),1)).join('')}</div></div>

function closeMe(keep){
 if(keep){me={...meDraft};if(me.lashes==='0'||!+me.lashes)delete me.lashes;else me.lashes=1;if(!me.lips||me.lips==='0')delete me.lips;
  store.set(ME_KEY,JSON.stringify(me));if(typeof C.PLAYER!=='function')player.look=myLook(C.PLAYER||CREW_LOOK);toast('반가워요! 👋')}

if(CREATOR)$('meOpts').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,on=meDraft[k]&&meDraft[k]!=='0';
 meDraft[k]=b.dataset.t?(on?'0':b.dataset.v):b.dataset.v;drawMePreview()});  // data-t = an on/off toggle
if(CREATOR)$('meRandom').addEventListener('click',()=>{const pick=a=>a[Math.random()*a.length|0];meDraft={style:pick(ME_OPTS.style)[0],hair:pick(ME_OPTS.hair),skin:pick(ME_OPTS.skin),lashes:pick(['1','0']),lips:pick(['#C25B6A','0'])};drawMePreview()});

/* START: everything that isn't the game itself (logs, dictionary, chapters, reading aloud, sound) */
/* 문제 알리기: a report goes to the word-reports inbox on seldoncortex.com. Artifacts can't call other sites, so 보내기 is a
   plain link that carries the report after the # (never in server logs); the page there posts it once and says thanks. */
const REPORT_URL='https://seldoncortex.com/word-reports/';let lastLines=[],repKind='game',lastWord='';
function reportCtx(){
 return {chapter:CH.n+' '+CH.title,place:roomName||Z.name,zone:ZID,pos:player.x+','+player.y,objective:(C.questText&&C.questText())||'',
  line:dlg&&dlg.cur?lastLines[lastLines.length-1]:'',lines:lastLines.join('\n'),word:lastWord}
}
function reportHref(){
 const r={game:G.prefix,kind:repKind,note:$('repNote').value.trim().slice(0,1000),build:CH.id,ctx:reportCtx()};
 const b=new TextEncoder().encode(JSON.stringify(r));let bin='';b.forEach(x=>bin+=String.fromCharCode(x));
 return REPORT_URL+'#'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function openReport(){
 if(!$('repPanel')){
  const P=document.createElement('div');P.className='panel';P.id='repPanel';P.hidden=true;
  P.innerHTML=`<div class="sheet talksheet" role="dialog" aria-label="문제 알리기"><h2><span>문제 알리기</span><button class="btn" id="repClose">닫기</button></h2>
   <div class="row tapsort"><button class="btn" id="repGame">게임이 이상해요</button><button class="btn" id="repKo">한국어가 이상해요</button></div>
   <div id="repCtx" style="font-size:.85rem;opacity:.75;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0"></div>
   <textarea id="repNote" rows="3" maxlength="1000" placeholder="무엇이 이상해요?" style="width:100%;box-sizing:border-box;font:inherit;padding:8px;border-radius:8px"></textarea>
   <div class="row" style="justify-content:flex-end;margin-top:8px"><a class="btn" id="repSend" target="_blank" rel="noopener" style="text-decoration:none">보내기</a></div></div>`;
  document.body.append(P);
  P.addEventListener('click',e=>{if(e.target===P)closeReport()});$('repClose').addEventListener('click',closeReport);
  $('repGame').addEventListener('click',()=>setRepKind('game'));$('repKo').addEventListener('click',()=>setRepKind('korean'));
  $('repNote').addEventListener('input',()=>{$('repSend').href=reportHref()});
  $('repSend').addEventListener('click',()=>{$('repSend').href=reportHref();setTimeout(()=>{closeReport();$('repNote').value='';toast('고마워요!')},300)});
 }
 const c=reportCtx();$('repCtx').textContent=[c.chapter+' · '+c.place,c.line||lastLines[lastLines.length-1]||'',c.word?'단어: '+c.word:''].filter(Boolean).join('\n');
 setRepKind(repKind);$('repPanel').hidden=false;document.body.classList.add('talkopen');hideGloss();
}
function setRepKind(k){repKind=k;$('repGame').classList.toggle('on',k==='game');$('repKo').classList.toggle('on',k==='korean');$('repSend').href=reportHref()}
function closeReport(){$('repPanel').hidden=true;document.body.classList.remove('talkopen')}
function toggleStart(){const P=$('startPanel');if(P.hidden&&panelOpen())return;P.hidden=!P.hidden;hideGloss()}
{const g=$('startPanel').querySelector('.mgrid'),odd=g.querySelectorAll('.mi:not(.wide)').length%2;  // fill the gap next to a lone item, else a full row
 const b=document.createElement('button');b.className=odd?'mi':'mi wide';b.id='repBtn';b.textContent='문제 알리기';b.addEventListener('click',()=>{$('startPanel').hidden=true;openReport()});$('startPanel').querySelector('.mgrid').append(b)}
$('startBtn').addEventListener('click',toggleStart);$('startClose').addEventListener('click',()=>$('startPanel').hidden=true);
$('startPanel').addEventListener('click',e=>{if(e.target.id==='startPanel'){$('startPanel').hidden=true;return}
 const mi=e.target.closest('.mi');if(mi&&!mi.classList.contains('toggle'))$('startPanel').hidden=true},true);  // capture: close the menu before the item opens its panel
$('tapBtn').addEventListener('click',openTaps);$('tapClose').addEventListener('click',closeTaps);
$('tapSortT').addEventListener('click',()=>{tapSort='t';openTaps()});$('tapSortN').addEventListener('click',()=>{tapSort='n';openTaps()});
$('tapPanel').addEventListener('click',e=>{if(e.target.id==='tapPanel'){closeTaps();return}const p=e.target.closest('.tp');if(p){const en=p.querySelector('.tpe');en.hidden=!en.hidden}});$('talkClose').addEventListener('click',closeTalk);
$('talkPanel').addEventListener('click',e=>{if(e.target.id==='talkPanel'){closeTalk();return}const gl=e.target.closest('.gl');if(gl){showGloss(gl.dataset.k);return}const w=e.target.closest('.w');if(w)showWord(w.textContent)});
/* debug (START → 디버그, saved per game): a 건너뛰기 button on every conversation runs it to the end — right answers, finished word
   orders, every flag / item / word it sets, quietly — and stops at a real decision (a plain choice like "2교시로 갈까요?"). For testing. */
let debugOn=store.get(KEY('debug'))==='1';
function skipTalk(){
 const snd=soundOn;soundOn=false;
 for(let n=0;dlg&&n<500;n++){
  if(typing&&!typing.finished)typing.fin();
  const s=dlg.cur;
  if(s.choose)break;
  if(s.ask&&!dlg.next){choose(s,s.opts.findIndex(o=>o[1]));continue}
  if(s.build&&!dlg.next){for(let i=s.got;i<s.build.length;i++)pickTile(s,$('tiles').querySelector(`.tile[data-i="${i}"]`));continue}
  advance();
 }
 soundOn=snd;if(TTS)try{speechSynthesis.cancel()}catch(e){}
}
(()=>{const grid=document.querySelector('#startPanel .mgrid');if(!grid)return;
 grid.insertAdjacentHTML('beforeend','<button class="mi toggle" id="dbgBtn" aria-pressed="false">디버그</button>');
 $('spk').insertAdjacentHTML('beforebegin','<button class="spk" id="skipBtn" type="button" hidden style="width:auto;padding:0 8px;margin-left:auto;margin-right:6px;font-size:.8rem;font-weight:700">건너뛰기</button>');
 const upd=()=>{$('dbgBtn').setAttribute('aria-pressed',debugOn?'true':'false');$('skipBtn').hidden=!debugOn};upd();
 $('dbgBtn').addEventListener('click',()=>{debugOn=!debugOn;store.set(KEY('debug'),debugOn?'1':'0');upd();sfx('ok');toast(debugOn?'디버그: 대화에 건너뛰기 버튼':'디버그 꺼짐')});
 $('skipBtn').addEventListener('click',e=>{e.stopPropagation();skipTalk()});
})();
$('sndBtn').addEventListener('click',()=>{soundOn=!soundOn;store.set(KEY('sound'),soundOn?'1':'0');updateSound();sfx('ok')});
$('readBtn').addEventListener('click',()=>{
 if(!canSpeak()){toast('이 기기에는 한국어 음성이 없어요.');return}
 readOn=!readOn;store.set(KEY('read'),readOn?'1':'0');updateRead();toast(readOn?'대사를 소리 내서 읽어요.':'읽기를 껐어요.');if(readOn&&dlg)speak(dlg.cur.say||dlg.cur.ask||'');
});
$('closePanel').addEventListener('click',()=>$('panel').hidden=true);

let armT;
$('resetBtn').addEventListener('click',()=>{
 const b=$('resetBtn');
 if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='한 번 더 누르면 지워져요';clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove('armed');b.textContent='처음부터'},3000);return}
 b.classList.remove('armed');b.textContent='처음부터';
 state=fresh();state.seenIntro=true;save();loadZone(state.zone,state.x,state.y,state.dir);updateHud();updateQuest();$('panel').hidden=true;
 setTimeout(()=>openDialog(CH.introWho||G.title||'이야기',C.INTRO),300);  // starting over replays the intro, like a first start
});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelector('.pad').addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{
 if(e.target.closest&&e.target.closest('textarea,input'))return;  // typing a note, not playing
 if(KEYS[e.key]){e.preventDefault();if(dirPress(KEYS[e.key]))return;held=KEYS[e.key];return}
 if(choosing()&&/^[1-4]$/.test(e.key)){const b=choiceBtns()[+e.key-1];if(b){e.preventDefault();b.click()}return}
 if([' ','Enter','z','Z'].includes(e.key)){e.preventDefault();if(!e.repeat)interact();return}
 if(['x','X','Escape'].includes(e.key)){e.preventDefault();cancel();return}
 if(['m','M'].includes(e.key)&&!e.repeat){e.preventDefault();toggleStart()}
});
addEventListener('keyup',e=>{if(KEYS[e.key]===held)held=null});

/* ---------- chapters (each keeps its own save; old chapters are never overwritten) ---------- */
const BASE_TILES={...TILES};
function boot(id){
 CH=CHAPTERS.find(c=>c.id===id)||CHAPTERS[0];
 C=CH.make();
 Object.keys(TILES).forEach(k=>{if(!(k in BASE_TILES))delete TILES[k]});Object.assign(TILES,C.TILES||{});
 player.look=typeof C.PLAYER==='function'?myLook():myLook(C.PLAYER||CREW_LOOK);  // PLAYER as a function = a disguise, drawn at render time // a chapter may put the player in someone else's shoes (5장: Terence)
 if(dlg){dlg=null;clearInterval(typing?.id);$('dlg').hidden=true}
 pending=null;held=null;warping=false;$('panel').hidden=true;$('chPanel').hidden=true;$('toast').hidden=true;logSel=null;
 store.set(KEY('chapter'),CH.id);
 loadState();loadTalk();
 loadZone(state.zone,state.x,state.y,state.dir);
 $('chName').textContent=CH.n;
 updateHud();updateQuest();
 if(!state.seenIntro){state.seenIntro=true;save();const intro=()=>setTimeout(()=>openDialog(CH.introWho||G.title||'이야기',C.INTRO),300);if(me||!CREATOR)intro();else openMe(intro)}  // first time ever: make your character first
}
function chapterProgress(c){try{const s=JSON.parse(store.get(c.save)||'null');return s?{got:(s.badges||[]).length,done:!!(s.f&&s.f.done)}:{got:0,done:false}}catch(e){return {got:0,done:false}}}
function openChapters(){
 $('chList').innerHTML=CHAPTERS.map(c=>{const p=chapterProgress(c);
  return `<button class="chap${c===CH?' cur':''}" data-id="${c.id}"><span class="cn" style="background:${c.color}">${c.n}</span><span class="ci"><b>${c.title}</b><small>${c.place||''}</small></span><span class="cp">${p.done?'끝':p.got+'/'+c.words}</span></button>`}).join('');
 $('chList').querySelectorAll('.chap').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;$('chPanel').hidden=true;if(id!==CH.id){boot(id);sfx('door')}}));
 $('chPanel').hidden=false;$('chList').querySelector('.cur')?.focus();
}
$('chBtn').addEventListener('click',openChapters);
$('chPanel').addEventListener('click',e=>{if(e.target.id==='chPanel')$('chPanel').hidden=true});
$('chClose').addEventListener('click',()=>$('chPanel').hidden=true);

/* ---------- start ---------- */
function start(){
 if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
 updateSound();updateRead();
 const want=new URLSearchParams(location.search).get('ch')||store.get(KEY('chapter'));
 boot(CHAPTERS.some(c=>c.id===want)?want:CHAPTERS[0].id); // first visit starts at chapter 1; after that, the last chapter played
 requestAnimationFrame(loop);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start();
